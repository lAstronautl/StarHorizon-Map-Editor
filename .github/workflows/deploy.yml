name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout map editor
        uses: actions/checkout@v4

      - name: Checkout StarHorizon Resources
        run: |
          git clone --filter=blob:none --no-checkout --depth=1 --sparse \
            https://github.com/StarHorizon14/StarHorizon.git ../StarHorizon
          cd ../StarHorizon
          git sparse-checkout set Resources
          git checkout master

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Prebuild resources
        run: node scripts/prebuild-resources.mjs --textures=minimal --resources-path=../StarHorizon/Resources --fork-name=StarHorizon

      - name: Stamp service worker with build ID
        # Changing the service worker's own bytes on every deploy is what makes the
        # browser notice it's "new" and go through install/activate again — without
        # this, an unmodified public/sw.js is byte-identical across deploys and never
        # triggers an update (see public/sw.js's own comment for the full mechanism).
        run: sed -i "s/__BUILD_ID__/${GITHUB_SHA}/" public/sw.js

      - name: Build
        run: npx tsc && npx vite build
        env:
          GITHUB_PAGES: "true"

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
